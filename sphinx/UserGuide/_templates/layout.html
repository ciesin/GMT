{% extends "!layout.html" %}
{% block extrahead %}
<link href="{{pathto("_static/style.css", 1) }}" rel="stylesheet" type="text/css">
<link rel="manifest" href="./{{pathto("manifest.webmanifest", 1) }}">
<script>

    // Change the logo link to go to the GMT app
    setTimeout(() => {
      var logo_elements = document.getElementsByClassName("logo");
      if (logo_elements.length == 1) {
        console.log("Changing logo link");
        logo_elements[0].parentElement.href = "/";
      } else {
        console.log("NOT Changing logo link");
      }
    }, 250);

    // Registering our Service worker
    if ('serviceWorker' in navigator) {
        let broadcastChannel = new BroadcastChannel('sw-messages');
        console.log("sw:","{{ pathto('sw.js',1) }}");
        navigator.serviceWorker.register("{{pathto('sw.js',1)}}")
        // navigator.serviceWorker.register('sw.js', { scope: "./" })
        broadcastChannel.addEventListener('message', event => {
            console.log('main Received', event.data);
            if (event.data.cacheDone) {
                localStorage['cacheDone'] = true;
            }
            if (event.data.reload) {
                window.location.reload();
            }
        });

        setInterval(async () => {
            let fetchResp;
            try {
                fetchResp = await fetch("{{ pathto('_static/version',True)}}", {
                    method: 'GET',
                    headers: new Headers({
                        'pragma': 'no-cache',
                        'cache-control': 'no-cache',
                    }),
                });
            }catch(error) {
                console.log("New version detection impossible: ", error);
            }
            const serverVersion = await fetchResp.text();
            const oldVersion = localStorage['version'];
            const cache = await caches.open('GMT_DOC');
            const keys = await cache.keys();
            console.log("keys length:",keys.length);
            if (serverVersion !== oldVersion || keys.length === 0
                || ((localStorage['cacheDone']+"") === "false")) //bb: !localStorage['cacheDone'] not working. This is mysterious..
            {
                localStorage['version'] = serverVersion;
                console.log("New version available: ", oldVersion, "=>", serverVersion);
                localStorage['cacheDone'] = false;
                broadcastChannel.postMessage({updateCache: true, oldVersion});
            } else {
                console.log("Current version :", oldVersion)
            }
        },5000);}
</script>
{% endblock %}
