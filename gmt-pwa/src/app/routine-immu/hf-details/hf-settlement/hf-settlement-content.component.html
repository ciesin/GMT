<mat-expansion-panel
  class="sub-sub-expansion"
  (opened)="panelOpenState = true"
  (closed)="panelOpenState = false"
  (click)="onOpenPanelAction()"
>
  <mat-expansion-panel-header *ngIf="fullCoverageSett">
    <mat-panel-title
      [class]="{'has-problematic': hasProblems()}"
    >
      <!-- fa-icon
        icon="location-crosshairs"
        class="accordion-title-icon location-icon"
        (click)="handleShowSettlementSiteOnMap($event)"
      ></fa-icon -->
      <span>{{displayName}}</span>
    </mat-panel-title>
    <mat-panel-description>
      <div class="gmt-stats" *ngIf="fullCoverageSett">
        <div class="gmt-stats-text">
          <span>{{formatPopulation(fullCoverageSett.pop)}}</span>
          <!--          <span>{{formatPercentage(100 - fullCoverageSett.percUnclaimed)}} %</span>-->
        </div>
        <gmt-catchment
          mode="progressbar"
          type="settlement"
          [total]="fullCoverageSett.pop"
          [fixedPost]="fullCoverageSett.fixedPost"
          [outreach]="fullCoverageSett.outreach"
          [unclaimed]="fullCoverageSett.unclaimed"
          [settlementProblems]="fullCoverageSett.problematic"
        >
        </gmt-catchment>
      </div>
    </mat-panel-description>
  </mat-expansion-panel-header>

  <!--	<gmt-catchment mode="detailed" type="settlement" [total]="fullCoverageSett.pop" [fixedPost]="fullCoverageSett.fixedPost"-->
  <!--		[outreach]="fullCoverageSett.outreach" [unclaimed]="fullCoverageSett.unclaimed"-->
  <!--		[problematic]="fullCoverageSett.problematic"></gmt-catchment>-->

  <div>
    <div class="problems-and-boundary-content" *ngIf="fullCoverageSett">
      <div>
        <div class="problematic">
          <fa-icon icon="person-circle-exclamation"></fa-icon>
          <span>{{getProblemStr()}}</span>
        </div>
        <div class="unclaimed">
          <fa-icon icon="person-circle-question"></fa-icon>
          <span
            >{{formatPercentage(fullCoverageSett.percUnclaimed)}}
            Unclaimed</span
          >
        </div>
      </div>

      <!-- div
        *ngIf="currentBoundaryId == settlement.properties.boundary_polygon"
        class="inside-outside-ward-content"
      >
        <fa-icon icon="right-to-bracket" class="accordion-title-icon"></fa-icon>
        <div>Inside Ward</div>
      </div -->
      <div
        *ngIf="currentBoundaryId !== settlement.properties.boundary_polygon"
        class="inside-outside-ward-content"
      >
        <fa-icon
          icon="right-from-bracket"
          class="accordion-title-icon"
        ></fa-icon>
        <div>Outside Ward</div>
        <div class="ward-name">{{stBoundaryName}}</div>
      </div>
    </div>

    <div class="detailed" *ngIf="fullCoverageSett">
      <div class="detailed-catchment">
        <h6>This Facility</h6>
        <div class="catchment-chips">
          <gmt-catchment-chip
            color="var(--catchment-fixed)"
            title="Fixed Post"
            icon="house-medical"
            [value]="formatPercentage(hfCoverageFixedPost)"
            [detailIcon]="settlementIcon"
          ></gmt-catchment-chip>
          <gmt-catchment-chip
            color="var(--catchment-outreach)"
            title="Outreach"
            icon="house-medical-flag"
            [value]="formatPercentage(hfCoverageOutreach)"
            [detailIcon]="settlementIcon"
          ></gmt-catchment-chip>
        </div>
      </div>
      <div class="detailed-catchment">
        <h6>Other Facilities</h6>
        <div class="catchment-chips">
          <gmt-catchment-chip
            color="var(--catchment-fixed)"
            title="Fixed Post"
            icon="house-medical"
            [value]="formatPercentage(fullCoverageSett.percFixedPost - hfCoverageFixedPost)"
            [detailIcon]="settlementIcon"
          ></gmt-catchment-chip>
          <gmt-catchment-chip
            color="var(--catchment-outreach)"
            title="Outreach"
            icon="house-medical-flag"
            [value]="formatPercentage(fullCoverageSett.percOutreach - hfCoverageOutreach)"
            [detailIcon]="settlementIcon"
          ></gmt-catchment-chip>
        </div>
      </div>
    </div>
  </div>
  <div class="mat-action-row">
    <button
      *ngIf="controlsEnabled"
      mat-button
      color="accent"
      [disabled]="isLoadingService.loading | async"
      (click)="excludeSettlement()"
    >
      <fa-icon icon="ban"></fa-icon>
      Exclude
    </button>
    <button
      mat-flat-button
      color="accent"
      class="main"
      (click)="redirectToDetails()"
    >
      <fa-icon icon="share"></fa-icon>
      <span class="pre-label">go to</span>
      <span class="label">details</span>
    </button>
  </div>
</mat-expansion-panel>
