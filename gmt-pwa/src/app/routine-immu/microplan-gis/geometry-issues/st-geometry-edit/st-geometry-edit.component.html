<ng-container
  *ngIf="settlementIssueItem && settlementIssueItem.settlementName && settlementIssueItem.settlementPart"
>
  <div class="panel-content">
    <mat-accordion displayMode="flat">
      <mat-expansion-panel
        class="sub-sub-expansion is-form"
        (opened)="panelOpenState = true"
        (closed)="panelOpenState = false"
        (click)="onOpenPanelAction()"
      >
        <mat-expansion-panel-header>
          <mat-panel-title
            [class]="{'has-problematic': hasProblems()}"
          >
            <fa-icon
              icon="location-crosshairs"
              (click)="handleShowSettlementSiteOnMap($event)"
            ></fa-icon>
            {{settlementIssueItem.settlementName.properties.name}}
          </mat-panel-title>
          <mat-panel-description>
            <div class="gmt-stats">
              <div class="gmt-stats-text">
                <span>{{formatPopulation(coverage.pop)}}</span>
                <!-- span>{{formatPercentage(100 - coverage.percUnclaimed)}}</span -->
              </div>
              <gmt-catchment
                mode="progressbar"
                type="settlement"
                [total]="coverage.pop"
                [fixedPost]="coverage.fixedPost"
                [outreach]="coverage.outreach"
                [unclaimed]="coverage.unclaimed"
                [settlementProblems]="coverage.problematic"
              >
              </gmt-catchment>
            </div>
          </mat-panel-description>
        </mat-expansion-panel-header>
        <div class="panel-content">
          <div>{{messages}}</div>
          <div>Please edit settlement's location</div>
        </div>
        <div class="mat-action-row">
          <button mat-button (click)="redirectToDetails()">
            <fa-icon icon="location-crosshairs"></fa-icon>
            <span class="label">GO TO details</span>
          </button>
          <button
            mat-flat-button
            (click)="enableLocationWizard()"
            *ngIf="userCanEdit"
          >
            <fa-icon icon="location-crosshairs"></fa-icon>
            <span class="label">edit location</span>
          </button>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
  </div>
</ng-container>
