[package]
name = "cmdline_tools"
version = "0.1.0"
authors = ["root"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
geo_util = { path = "../geo_util" }
anyhow = "1.0"
itertools = "*"
structopt = { version = "0.3" }
format_num = "*"
rayon = "1.4"
ndarray = {version = "0.13", features = ["rayon"] }
float-cmp = "0"
num = "0"
serde = {version="1.0", features = ["derive"]}
crossbeam = "0"
chrono = {version="0", features = ["serde"]}
partitions = "0.2.4"
simple_logger="2.1.0"
log="0.4.14"
uuid = { version = "1", features = ["serde", "v4", "fast-rng"] }
serde_json = "1"
bytes = "1"
bincode = "1.3.3"
#tokio-postgres = {version="0.7.5", features = ["with-uuid-0_8"] }
postgres = {version="0.19.3", features = ["with-uuid-1", "with-geo-types-0_7", "with-bit-vec-0_6", "with-serde_json-1" ] }
geo-types = "0.7.3"
bitvec = { version = "1", features = ["serde"] }

[dependencies.geo]
version = "0.19"
features = ["serde", "use-serde"]

[dependencies.gdal]
version = "*"
path = "../gdal"
#path = "D:\\git\\gdal"
#git = "https://github.com/eric7237cire/gdal"
#branch = "experiment1"
features = ["array"]

# not sure why we are getting an error
[dependencies.rstar]
version = "0.9.1"
features = ["serde"]

[dependencies.geos]
features = ["geo", "v3_8_0"]
path = "../geos"

